<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Prep — JS, Output, React, React Native</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="logo" href="./">
        <span class="logo-mark" aria-hidden="true"></span>
        Interview
      </a>
      <nav id="module-nav" class="module-nav" aria-label="Modules"></nav>
      <div class="header-actions">
        <button type="button" class="text-btn" id="export-btn">Export</button>
        <label class="text-btn">
          Import
          <input id="import-input" type="file" accept="application/json" hidden />
        </label>
        <button type="button" class="btn btn-primary" id="add-btn">Add answer</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <button type="button" class="back-btn" id="first-topic-btn">‹ Back to Course</button>
        <div class="step-dots" id="step-dots"></div>

        <div class="module-card">
          <h2 id="module-title">Module 1</h2>
          <p id="module-tagline"></p>
          <p class="module-kicker" id="module-kicker">0 / 0 topics</p>
          <div class="progress-row">
            <span id="progress-label" hidden>0 / 0 topics</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p class="remain" id="time-remain"></p>
        </div>

        <p class="topics-label">Topics</p>
        <nav id="sidebar-nav" class="sidebar-nav" aria-label="Topics"></nav>
      </aside>

      <main class="lesson">
        <header class="hero">
          <p class="eyebrow" id="crumb">Interview prep</p>
          <h1 id="lesson-title">JavaScript Interview Questions</h1>
          <p class="lede" id="lesson-lede"></p>
          <div class="hero-meta" id="hero-meta"></div>
          <aside class="callout">
            <p class="callout-label">Interviewer tip</p>
            <p id="callout"></p>
          </aside>
        </header>

        <section class="quiz">
          <div class="quiz-head">
            <h2 id="quiz-heading">Questions and answers</h2>
            <span class="level-pill" id="level-pill">Basic to Advanced</span>
          </div>
          <div id="quiz-list" class="quiz-list"></div>
        </section>

        <section class="takeaways">
          <h2>Key Takeaways</h2>
          <ul id="takeaways-list"></ul>
        </section>
      </main>
    </div>

    <dialog id="editor" class="editor">
      <form id="editor-form" method="dialog">
        <header>
          <h3 id="editor-title">Add an answer</h3>
          <button type="button" class="icon-btn" id="editor-close" aria-label="Close">
            ×
          </button>
        </header>

        <label>
          Topic
          <select name="topicId" required>
            <option value="javascript">JavaScript</option>
            <option value="output">Output</option>
            <option value="react">React</option>
            <option value="react-native">React Native</option>
          </select>
        </label>

        <label>
          Level
          <select name="level" required>
            <option value="basic">Basic</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </label>

        <label>
          Question
          <input name="q" type="text" required placeholder="What is a closure?" />
        </label>

        <label>
          Answer
          <textarea
            name="a"
            rows="10"
            required
            placeholder="Write the answer you would give in an interview…"
          ></textarea>
        </label>

        <footer>
          <button type="button" class="btn" id="editor-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save answer</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
